<!doctype html>
<html lang="en">
<head>
  {% load static %}
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Choose a new password for your CSE Inventory account." />
  <title>CSE Inventory &mdash; Reset Password</title>
  <link rel="icon" href="{% static 'img/just-logo.png' %}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/theme.css' %}">
  <link rel="stylesheet" href="{% static 'css/auth.css' %}">
</head>
<body class="auth">
  <div class="auth-wrap single">
    <section class="auth-card">
      <div class="icon">
        <svg viewBox="0 0 24 24"><circle cx="7.5" cy="15.5" r="4.5"/><path d="m10.7 12.3 8.8-8.8"/><path d="m17 6 2.5 2.5"/><path d="m14.5 8.5 2.5 2.5"/></svg>
      </div>

      <h1>Reset password</h1>
      <p class="lead">
        Choose a new password. Make it long and hard to guess.
      </p>

      <div id="error" class="error"></div>
      <div id="success" class="success"></div>

      <form id="resetForm" novalidate>
        <div class="field">
          <label for="password">New password</label>
          <div class="password-group">
            <input type="password" id="password" placeholder="Enter new password" minlength="8" autocomplete="new-password" required />
            <button type="button" class="toggle-pwd" onclick="togglePassword('password')" aria-label="Show or hide password">
              <svg viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
          <div class="password-strength">
            <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
            <span id="strengthText">Password strength: <span id="strengthLabel">&ndash;</span></span>
          </div>
        </div>

        <div class="field">
          <label for="confirmPassword">Confirm password</label>
          <div class="password-group">
            <input type="password" id="confirmPassword" placeholder="Confirm new password" minlength="8" autocomplete="new-password" required />
            <button type="button" class="toggle-pwd" onclick="togglePassword('confirmPassword')" aria-label="Show or hide password">
              <svg viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <button type="submit" id="submitBtn">Reset password</button>
      </form>

      <div class="back-link">
        <a href="/">&larr; Back to sign in</a>
      </div>
    </section>
  </div>

  <script src="{% static 'js/reset-password.js' %}"></script>
</body>
</html>
