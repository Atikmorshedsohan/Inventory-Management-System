<!doctype html>
<html lang="en">
<head>
  {% load static %}
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Reset your CSE Inventory Management System password." />
  <title>CSE Inventory &mdash; Forgot Password</title>
  <link rel="icon" href="{% static 'img/just-logo.png' %}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/theme.css' %}">
  <link rel="stylesheet" href="{% static 'css/auth.css' %}">
</head>
<body class="auth">
  <div class="auth-wrap single">
    <section class="auth-card">
      <div class="icon">
        <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      </div>

      <h1>Forgot password?</h1>
      <p class="lead">
        Enter your email address and we&rsquo;ll send you a link to reset your password.
      </p>

      <div id="error" class="error"></div>
      <div id="success" class="success"></div>

      <form id="forgotForm" novalidate>
        <div class="field">
          <label for="email">Email address</label>
          <input type="email" id="email" placeholder="you@cse.edu" autocomplete="email" required autofocus />
        </div>

        <button type="submit" id="submitBtn">Send reset link</button>
      </form>

      <div class="back-link">
        <a href="/">&larr; Back to sign in</a>
      </div>
    </section>
  </div>

  <script src="{% static 'js/forgot-password.js' %}"></script>
</body>
</html>
